version: "3.9"

services:
  summar_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: summar-iq-api
    ports:
      - "8000:8000"
    restart: always

  gradio_ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: summar-iq-gradio
    command: ["python", "gradio_app.py"]
    ports:
      - "7860:7860"
    depends_on:
      - summar_api
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - summar_api

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin



