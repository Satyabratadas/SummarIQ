version: "3.9"

services:
  summar_api:
    build:
      context: ..          
      dockerfile: deployment/Dockerfile
    container_name: summar-iq-api
    ports:
      - "8000:8000"
    restart: always

  gradio_ui:
    build:
      context: ..           
      dockerfile: deployment/Dockerfile
    container_name: summar-iq-gradio
    command: ["python", "deployment/gradio_app.py"]
    ports:
      - "7860:7860"
    depends_on:
      - summar_api
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - summar_api

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-storage:/var/lib/grafana
  
  node_exporter:
    image: prom/node-exporter
    container_name: node_exporter
    ports:
      - "9100:9100"
    restart: always

  # gpu_exporter:
  #   image: nvcr.io/nvidia/k8s/dcgm-exporter:3.1.8-3.4.0
  #   container_name: nvidia_gpu_exporter
  #   runtime: nvidia
  #   environment:
  #     - NVIDIA_VISIBLE_DEVICES=all
  #   ports:
  #     - "9400:9400"
  #   restart: always

volumes:
  grafana-storage:



